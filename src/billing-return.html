<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="{{RETURN_DESCRIPTION}}">
  <title>{{RETURN_TITLE}} · Proportion</title>
  <link rel="canonical" href="{{RETURN_URL}}">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/return.css">
  <script src="/js/return.js" defer></script>
</head>
<body class="return-page">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="nav" data-tone="light">
    <div class="nav-inner glass">
      <a class="brand" href="{{PUBLIC_SITE_URL}}" aria-label="Proportion home">
        <span class="brand-mark" aria-hidden="true">A</span><span class="brand-name">Proportion</span>
      </a>
      <nav class="nav-links" aria-label="Navigation"><a href="{{PUBLIC_SITE_URL}}">Back to the site</a></nav>
    </div>
  </header>
  <main class="container return-main" id="main" tabindex="-1">
    <article class="return-card" aria-labelledby="return-title">
      <p class="eyebrow">{{RETURN_EYEBROW}}</p>
      <h1 id="return-title">{{RETURN_HEADING}}</h1>
      <p class="lead">{{RETURN_LEAD}}</p>
      <div class="return-next"><h2>{{RETURN_NEXT_HEADING}}</h2><p>{{RETURN_NEXT}}</p></div>
      <div class="return-actions">
        <a class="btn btn-primary" href="{{CONTACT_URL}}">Talk to Proportion</a>
        <a class="btn btn-secondary" href="{{PUBLIC_SITE_URL}}">Back to the site</a>
      </div>
      <p class="return-note">{{RETURN_NOTE}}</p>
    </article>
  </main>
  <footer class="container return-foot">Proportion · AFO</footer>
</body>
</html>
